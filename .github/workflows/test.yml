name: Test Chisel

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      system:
        description: 'The GitHub runner to use'
        default: 'ubuntu-24.04'
        required: true
        type: string
      jvm:
        description: 'The Java version to use'
        default: 8
        required: true
        type: number
      scala:
        description: 'The Scala version to use'
        default: '2.13'
        required: true
        type: string
      circt:
        description: 'The CIRCT version to use (must be a valid release tag, "nightly", or "version-file"). Leave off (or empty) to let Chisel manage the CIRCT version'
        type: string
      ref:
        description: 'The branch, tag, or git hash to checkout'
        default: ''
        required: false
        type: string

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}
  espresso_version: '2.4'
  slang_version: '7.0'

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.system }}

    steps:
    - name: Checkout
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        ref: ${{ inputs.ref }}
    - name: Install Tabby OSS Cad Suite
      uses: ./.github/workflows/setup-oss-cad-suite
    - name: Install Espresso
      uses: ./.github/workflows/install-espresso
      with:
        version: ${{ env.espresso_version }}
    - name: Install Slang
      uses: ./.github/workflows/build-slang
      with:
        version: ${{ env.slang_version }}
    - name: Install FileCheck
      run: |
        sudo apt update
        sudo apt install llvm-19-tools
        echo "/usr/lib/llvm-19/bin" >> $GITHUB_PATH
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'adopt'
        java-version: ${{ inputs.jvm }}
    - name: Install CIRCT
      id: install-circt
      if: ${{ inputs.circt }}
      uses: circt/install-circt@3f8dda6e1c1965537b5801a43c81c287bac4eae4   # v1.1.1
      with:
        version: ${{ inputs.circt }}
        github-token: ${{ github.token }}
      # TODO have install-circt do this
    - name: Set CHISEL_FIRTOOL_PATH
      if: steps.install-circt.outcome == 'success'
      run: |
        dir=$(dirname $(which firtool))
        echo "CHISEL_FIRTOOL_PATH=$dir" >> "$GITHUB_ENV"
    - name: Print firtool version
      if: steps.install-circt.outcome == 'success'
      run: |
        echo "The CIRCT version used is:" >> $GITHUB_STEP_SUMMARY
        echo \`\`\` >> $GITHUB_STEP_SUMMARY
        $CHISEL_FIRTOOL_PATH/firtool -version >> $GITHUB_STEP_SUMMARY
        echo \`\`\` >> $GITHUB_STEP_SUMMARY
    - name: Test
        # Note firrtl tests don't work with Scala 3 so just run default version (2.13) for now.
      run: ./mill firrtl.cross[].test -oF + svsim.cross[${{ inputs.scala }}].test -oF + chisel[${{ inputs.scala }}].test -oF + chisel[${{ inputs.scala }}].unitTest -G-v

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
