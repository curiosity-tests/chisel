name: Build and Test Chisel Scala-CLI Example

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      circt:
        description: 'The version of CIRCT to use'
        type: string

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  build_example:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        # Need to fetch full history for deriving version
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          fetch-depth: 0
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Install CIRCT
        id: install-circt
        if: ${{ inputs.circt }}
        uses: circt/install-circt@3f8dda6e1c1965537b5801a43c81c287bac4eae4 # v1.1.1
        with:
          version: ${{ inputs.circt }}
          github-token: ${{ github.token }}
      # TODO have install-circt do this
      - name: Set CHISEL_FIRTOOL_PATH
        if: steps.install-circt.outcome == 'success'
        run: |
          dir=$(dirname $(which firtool))
          echo "CHISEL_FIRTOOL_PATH=$dir" >> "$GITHUB_ENV"
      - name: Cache Scala-CLI
        uses: coursier/cache-action@90c37294538be80a558fd665531fcdc2b467b475 # v8.1.0
      - name: Setup Scala-CLI
        uses: VirtusLab/scala-cli-setup@14e5155ee896fcc200f66f92c9eb7a3dd9b58e0d # v1.12.5
        with:
          jvm: adoptium:17
      - name: Generate Chisel Scala CLI Example
        shell: bash
        run: |
          # Determine the version and insert it into the example
          VERSION=$(./mill show 'unipublish[2.13].publishVersion' | tr -d \")
          .github/scripts/generate-scala-cli-example.sh $VERSION > chisel-example.scala
      # Need to publishLocal to test the example
      - name: Publish Local
        shell: bash
        run: |
          ./mill -i 'unipublish[2.13].publishLocal'
      - name: Test Scala CLI Example
        shell: bash
        run: scala-cli chisel-example.scala
      - name: Upload Example
        uses: actions/upload-artifact@v7
        with:
          name: chisel-example.scala
          path: chisel-example.scala
          retention-days: 7
